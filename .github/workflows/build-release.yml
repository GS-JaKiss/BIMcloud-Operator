name: Build release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Package Windows application
        run: npx electron-builder --win dir --x64

      - name: Create ZIP archive
        shell: powershell
        run: Compress-Archive -Path release/win-unpacked/* -DestinationPath BIMcloud-Operator-Windows-x64.zip

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: BIMcloud-Operator-Windows-x64
          path: BIMcloud-Operator-Windows-x64.zip
          if-no-files-found: error