name: Build release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Package Windows application
        run: npx electron-builder --win dir --x64

      - name: Set release metadata
        shell: powershell
        run: |
          $version = node -p "require('./package.json').version"
          "RELEASE_TAG=v$version" >> $env:GITHUB_ENV
          "ARCHIVE_NAME=BIMcloud-Operator-v$version-Windows-x64.zip" >> $env:GITHUB_ENV

      - name: Create ZIP archive
        shell: powershell
        run: Compress-Archive -Path release/win-unpacked/* -DestinationPath $env:ARCHIVE_NAME

      - name: Publish GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:RELEASE_TAG $env:ARCHIVE_NAME --target $env:GITHUB_SHA --title "BIMcloud Operator $env:RELEASE_TAG" --generate-notes